<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>html,body{margin:0;height:100%;background:#0E1A24;color:#EAF1F6;font-family:sans-serif;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%}button{background:#F2B544;color:#1A1200;border:0;border-radius:8px;padding:8px 16px;font-size:16px;font-weight:bold}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#bar{display:flex;gap:16px;align-items:center;font-size:20px;font-weight:bold}
#b{--s:min(88vw,60vh);width:var(--s);height:var(--s);display:grid;grid-template-columns:repeat(4,1fr);gap:2.5%;padding:2.5%;box-sizing:border-box;background:#16283A;border-radius:10px}
.c{display:flex;align-items:center;justify-content:center;border-radius:8px;background:#24405A;font-size:calc(var(--s)/7);color:#8FA6B8}
.c.up{background:#F2B544}
.c.done{background:#1D3248}
</style></head><body>
<div id="bar"><span id="mv">Jogadas: 0</span><button onclick="init()">Novo jogo</button></div>
<div id="b"></div><div id="msg" style="height:24px;font-size:18px"></div>
<script>
const E=['🍎','🚗','⭐','🐶','🎈','🍕','⚽','🌙'];
let cards,open,lock,moves,found;
function init(){cards=E.concat(E).sort(()=>Math.random()-0.5).map(e=>({e:e,up:false,done:false}));open=[];lock=false;moves=0;found=0;msg.textContent='';render();}
function render(){mv.textContent='Jogadas: '+moves;b.innerHTML=cards.map((c,i)=>'<div class="c'+(c.up?' up':'')+(c.done?' done':'')+'" data-i="'+i+'">'+((c.up||c.done)?c.e:'?')+'</div>').join('');}
b.onclick=function(ev){const d=ev.target.closest('.c');if(!d||lock)return;flip(+d.dataset.i);};
function flip(i){
  const c=cards[i];if(c.up||c.done)return;
  c.up=true;open.push(i);render();
  if(open.length===2){
    moves++;lock=true;const a=open[0],bb=open[1];
    if(cards[a].e===cards[bb].e){
      cards[a].done=cards[bb].done=true;cards[a].up=cards[bb].up=false;found++;open=[];lock=false;render();
      if(found===E.length)msg.textContent='🎉 Você venceu em '+moves+' jogadas!';
    }else{
      setTimeout(()=>{cards[a].up=cards[bb].up=false;open=[];lock=false;render();},800);
    }
  }
}
init();
</script></body></html>
