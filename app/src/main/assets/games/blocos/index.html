<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>html,body{margin:0;height:100%;background:#0E1A24;color:#EAF1F6;font-family:sans-serif;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%}button{background:#F2B544;color:#1A1200;border:0;border-radius:8px;padding:8px 16px;font-size:16px;font-weight:bold}
</style></head><body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,u;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;u=H/700}rs();addEventListener('resize',rs);
const COLS=8,ROWS=6,COLORS=['#E5655B','#F2B544','#F2B544','#5BC48A','#5BC48A','#4F9DDE'];
let px,bricks,ball,lives,score,state;
function setupBricks(){bricks=[];for(let r=0;r<ROWS;r++)for(let q=0;q<COLS;q++)bricks.push({q:q,r:r,alive:true});}
function resetBall(){ball={x:W/2,y:H-80*u,vx:0,vy:0};state=0;}
function reset(){px=W/2;lives=3;score=0;setupBricks();resetBall();}
reset();
function pw(){return Math.max(70,W*0.24);}
addEventListener('pointermove',e=>{px=e.clientX;if(state===0)ball.x=Math.max(pw()/2,Math.min(W-pw()/2,px));});
addEventListener('pointerdown',e=>{
  px=e.clientX;
  if(state===3||state===4){reset();return}
  if(state===0){const sp=420*u;ball.vx=sp*0.5;ball.vy=-sp*0.87;state=1;}
});
function update(dt){
  if(state!==1)return;
  const r=8*u,bw=W/COLS,bh=22*u,top=60*u,py=H-60*u,ph=12*u,w=pw();
  const half=Math.max(w/2,Math.min(W-w/2,px));
  ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;
  if(ball.x<r){ball.x=r;ball.vx=Math.abs(ball.vx);}
  if(ball.x>W-r){ball.x=W-r;ball.vx=-Math.abs(ball.vx);}
  if(ball.y<r){ball.y=r;ball.vy=Math.abs(ball.vy);}
  if(ball.vy>0&&ball.y+r>=py&&ball.y+r<=py+ph+12*u&&ball.x>half-w/2-r&&ball.x<half+w/2+r){
    const sp=Math.hypot(ball.vx,ball.vy),k=(ball.x-half)/(w/2);
    ball.vx=sp*k*0.8;ball.vy=-Math.sqrt(Math.max(sp*sp-ball.vx*ball.vx,1));
  }
  for(const br of bricks){
    if(!br.alive)continue;
    const bx=br.q*bw,by=top+br.r*bh;
    if(ball.x>bx&&ball.x<bx+bw&&ball.y-r<by+bh&&ball.y+r>by){br.alive=false;ball.vy=-ball.vy;score++;break;}
  }
  if(bricks.every(b=>!b.alive))state=3;
  if(ball.y>H+r){lives--;if(lives<=0)state=4;else resetBall();}
}
function txt(s,y,sz){x.fillStyle='#EAF1F6';x.textAlign='center';x.font='bold '+sz+'px sans-serif';x.fillText(s,W/2,y);}
function draw(){
  x.fillStyle='#0E1A24';x.fillRect(0,0,W,H);
  const bw=W/COLS,bh=22*u,top=60*u,w=pw(),half=Math.max(w/2,Math.min(W-w/2,px));
  bricks.forEach(b=>{if(!b.alive)return;x.fillStyle=COLORS[b.r];x.fillRect(b.q*bw+1,top+b.r*bh+1,bw-2,bh-2);});
  x.fillStyle='#EAF1F6';x.fillRect(half-w/2,H-60*u,w,12*u);
  x.fillStyle='#F2B544';x.beginPath();x.arc(ball.x,ball.y,8*u,0,Math.PI*2);x.fill();
  x.fillStyle='#8FA6B8';x.font=(16*u)+'px sans-serif';x.textAlign='left';x.fillText('Pontos: '+score,12,24*u);
  x.textAlign='right';x.fillText('Vidas: '+lives,W-12,24*u);
  if(state===0)txt('Toque para lançar',H/2,24*u);
  if(state===3)txt('Você venceu! Toque para reiniciar',H/2,22*u);
  if(state===4)txt('Fim de jogo. Toque para reiniciar',H/2,22*u);
}
let last=performance.now();
function loop(n){const dt=Math.min(0.033,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
