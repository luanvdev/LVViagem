<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>html,body{margin:0;height:100%;background:#0E1A24;color:#EAF1F6;font-family:sans-serif;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%}button{background:#F2B544;color:#1A1200;border:0;border-radius:8px;padding:8px 16px;font-size:16px;font-weight:bold}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#bar{display:flex;gap:16px;align-items:center;font-size:20px;font-weight:bold}
#b{--s:min(88vw,60vh);width:var(--s);height:var(--s);display:grid;grid-template-columns:repeat(4,1fr);gap:2.5%;padding:2.5%;box-sizing:border-box;background:#16283A;border-radius:10px}
.t{display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:bold;font-size:calc(var(--s)/9)}
</style></head><body>
<div id="bar"><span id="sc">0</span><button onclick="init()">Novo jogo</button></div>
<div id="b"></div><div id="msg" style="height:24px;font-size:18px"></div>
<script>
let g,score;
const COL={0:'#1D3248',2:'#EEE4DA',4:'#EDE0C8',8:'#F2B179',16:'#F59563',32:'#F67C5F',64:'#F65E3B',128:'#EDCF72',256:'#EDCC61',512:'#EDC850',1024:'#EDC53F',2048:'#EDC22E'};
function init(){g=[0,1,2,3].map(()=>[0,0,0,0]);score=0;msg.textContent='';add();add();draw();}
function add(){const e=[];g.forEach((r,y)=>r.forEach((v,x)=>{if(!v)e.push([x,y])}));if(!e.length)return;const p=e[Math.floor(Math.random()*e.length)];g[p[1]][p[0]]=Math.random()<0.9?2:4;}
function slide(row){const a=row.filter(v=>v);for(let i=0;i<a.length-1;i++){if(a[i]===a[i+1]){a[i]*=2;score+=a[i];a.splice(i+1,1);}}while(a.length<4)a.push(0);return a;}
function move(d){
  const old=JSON.stringify(g);
  if(d===0)g=g.map(slide);
  else if(d===1)g=g.map(r=>slide(r.slice().reverse()).reverse());
  else{const cols=[0,1,2,3].map(x=>g.map(r=>r[x]));
    const m=cols.map(c=>d===2?slide(c):slide(c.slice().reverse()).reverse());
    g=[0,1,2,3].map(y=>m.map(c=>c[y]));}
  if(JSON.stringify(g)!==old)add();
  draw();
  if(over())msg.textContent='Fim de jogo!';
}
function over(){for(let y=0;y<4;y++)for(let x=0;x<4;x++){if(!g[y][x])return false;if(x<3&&g[y][x]===g[y][x+1])return false;if(y<3&&g[y][x]===g[y+1][x])return false;}return true;}
function draw(){sc.textContent='Pontos: '+score;b.innerHTML=g.flat().map(v=>'<div class="t" style="background:'+(COL[v]||'#3C3A32')+';color:'+(v>4?'#fff':'#1A1200')+'">'+(v||'')+'</div>').join('');}
let sx,sy;
addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:0);else move(dy>0?3:2);});
addEventListener('keydown',e=>{const k={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3}[e.key];if(k!==undefined)move(k);});
init();
</script></body></html>
