<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>html,body{margin:0;height:100%;background:#0E1A24;color:#EAF1F6;font-family:sans-serif;touch-action:none;overflow:hidden;user-select:none;-webkit-user-select:none}canvas{display:block;width:100%;height:100%}button{background:#F2B544;color:#1A1200;border:0;border-radius:8px;padding:8px 16px;font-size:16px;font-weight:bold}
</style></head><body><canvas id="c"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,k;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;k=H/700}rs();addEventListener('resize',rs);
let lane,px,obs,score,speed,state,spawn,off,best=0;
function rw(){return Math.min(W*0.9,420);}
function laneX(l){return (W-rw())/2+rw()/3*(l+0.5);}
function cw(){return rw()/3*0.55;}
function reset(){lane=1;px=laneX(1);obs=[];score=0;speed=260;state=0;spawn=0;off=0;}
reset();
addEventListener('pointerdown',e=>{
  if(state===0){state=1;return}
  if(state===2){reset();return}
  if(e.clientX<W/2)lane=Math.max(0,lane-1);else lane=Math.min(2,lane+1);
});
addEventListener('keydown',e=>{if(state!==1)return;if(e.key==='ArrowLeft')lane=Math.max(0,lane-1);if(e.key==='ArrowRight')lane=Math.min(2,lane+1);});
function update(dt){
  if(state!==1)return;
  px+=(laneX(lane)-px)*Math.min(1,dt*14);
  off+=speed*k*dt;spawn-=dt;
  const ch=cw()*1.7,py=H-ch-30*k;
  if(spawn<=0){obs.push({l:Math.floor(Math.random()*3),y:-ch});spawn=Math.max(0.45,1.1-score*0.01);}
  obs.forEach(o=>o.y+=speed*k*dt);
  obs=obs.filter(o=>{if(o.y>H){score++;return false}return true;});
  speed=260+score*6;
  obs.forEach(o=>{if(Math.abs(laneX(o.l)-px)<cw()*0.8&&o.y+ch>py&&o.y<py+ch)state=2;});
  if(state===2&&score>best)best=score;
}
function car(cx,y,col){const w=cw(),h=w*1.7;x.fillStyle=col;x.beginPath();x.roundRect?x.roundRect(cx-w/2,y,w,h,8):x.rect(cx-w/2,y,w,h);x.fill();}
function txt(s,y,sz){x.fillStyle='#EAF1F6';x.textAlign='center';x.font='bold '+sz+'px sans-serif';x.fillText(s,W/2,y);}
function draw(){
  x.fillStyle='#1B5E3C';x.fillRect(0,0,W,H);
  const r=rw(),left=(W-r)/2;
  x.fillStyle='#2A3744';x.fillRect(left,0,r,H);
  x.fillStyle='#8FA6B8';
  for(let i=1;i<3;i++)for(let y=-80*k+(off%(80*k));y<H;y+=80*k)x.fillRect(left+r/3*i-2,y,4,40*k);
  obs.forEach(o=>car(laneX(o.l),o.y,'#E5655B'));
  car(px,H-cw()*1.7-30*k,'#F2B544');
  txt(String(score),50*k,40*k);
  if(state===0)txt('Toque para começar',H/2,24*k);
  if(state===2){txt('Batida!',H/2-10*k,34*k);txt('Melhor: '+best+' · toque para reiniciar',H/2+30*k,20*k);}
}
let last=performance.now();
function loop(n){const dt=Math.min(0.033,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script></body></html>
